<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Soporte — Quinta Esencia Teatro</title>
  <meta name="description" content="Canal de soporte y atención al espectador de Quinta Esencia Teatro y boletería digital.">
  <link rel="icon" href="/images/icon_red.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      border: 1px solid #222226;
      border-radius: 10px;
      background: #0a0a0c;
      padding: 32px 28px;
    }
    .kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c8102e;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    p {
      margin: 0 0 22px;
      font-size: 14.5px;
      line-height: 1.6;
      color: #a1a1aa;
    }
    .box {
      border: 1px solid #222226;
      border-radius: 8px;
      background: #050507;
      padding: 16px 18px;
      margin-bottom: 22px;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #71717a;
      margin-bottom: 6px;
    }
    .mail {
      display: inline-block;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(200, 16, 46, 0.7);
      padding-bottom: 2px;
    }
    .mail:hover {
      color: #c8102e;
    }
    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .links a {
      color: #a1a1aa;
      text-decoration: none;
    }
    .links a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="kicker">Quinta Esencia Teatro</div>
      <h1>Soporte al Espectador</h1>
      <p>
        Si tienes inconvenientes con tu entrada digital, activación de boleta o información sobre nuestras funciones, escríbenos directamente a nuestro correo de soporte.
      </p>
      <div class="box">
        <div class="label">Correo de contacto</div>
        <a class="mail" href="mailto:teatro5esencia@gmail.com">teatro5esencia@gmail.com</a>
      </div>
      <div class="links">
        <a href="https://5esencia.art/">&larr; Volver a Quinta Esencia</a>
        <a href="https://5esencia.art/alma-tickets">Boletería ALMA</a>
      </div>
    </section>
  </main>
</body>
</html>
