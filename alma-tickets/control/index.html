  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0c;
      color: #f4f3ef;
      -webkit-tap-highlight-color: transparent;
    }
    #almaControlFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      border: 0;
      background: #0b0b0c;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="almaControlFrame"
    title="Panel de Control — ALMA"
    allow="camera *; microphone *; autoplay *; clipboard-write *; fullscreen *"
    allowfullscreen
  ></iframe>
  <script>
    (function(){
      var APP_ORIGIN = 'https://alma-tickets-app.vercel.app';
      var SID_KEY = 'alma_ctrl_sid_v1';
      var PATH_KEY = 'alma_ctrl_last_path_v1';

      function getSavedSid(){
        try { return localStorage.getItem(SID_KEY) || ''; } catch(e){ return ''; }
      }

      window.addEventListener('message', function(ev){
        if(!ev || ev.origin !== APP_ORIGIN || !ev.data) return;
        if(ev.data.type === 'ALMA_CTRL_SID' && ev.data.sid){
          try { localStorage.setItem(SID_KEY, ev.data.sid); } catch(e){}
          if(ev.data.path){
            try { sessionStorage.setItem(PATH_KEY, ev.data.path); } catch(e){}
          }
        } else if(ev.data.type === 'ALMA_CTRL_LOGOUT'){
          try { localStorage.removeItem(SID_KEY); } catch(e){}
          try { sessionStorage.removeItem(PATH_KEY); } catch(e){}
        }
      });

      var params = new URLSearchParams(window.location.search);
      var sid = getSavedSid();
      if(sid && !params.has('_sid')){
        params.set('_sid', sid);
      }
      var targetPath = '/control';
      try {
        var lastPath = sessionStorage.getItem(PATH_KEY) || '';
        if(lastPath && lastPath.indexOf('/control') === 0 && !window.location.search){
          var u = new URL(APP_ORIGIN + lastPath);
          targetPath = u.pathname;
          u.searchParams.forEach(function(v, k){
            if(!params.has(k)) params.set(k, v);
          });
        }
      } catch(e){}
      var qs = params.toString();
      var frame = document.getElementById('almaControlFrame');
      frame.src = APP_ORIGIN + targetPath + (qs ? ('?' + qs) : '') + (window.location.hash || '');
    })();
  </script>
</body>
